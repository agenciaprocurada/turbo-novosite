# Config do nginx que o Dockerfile copia para /etc/nginx/conf.d/default.conf.
#
# Por que ela existe: o preset "Astro" da plataforma aplica fallback de SPA
# (`try_files $uri $uri/ /index.html`). Isso faz QUALQUER endereço inexistente
# devolver 200 com a home — /asaaaaa, /nada.txt, /_astro/nao-existe.css, tudo.
# O 404 nunca acontece.
#
# Fallback de SPA é o certo para app React de página única, onde só existe um
# HTML e o roteamento é no navegador. Aqui é o oposto: cada página é um arquivo
# de verdade no disco.
#
# Não dá para desligar pelo painel — o seletor de framework só oferece presets
# (Astro, Next.js, React estático, Node, ...) e nenhum serve site multipágina
# estático sem SPA. Por isso o projeto usa o preset Dockerfile.

server {
    listen 80;
    server_name _;

    # Caminho da imagem oficial do nginx, onde o Dockerfile copia o dist/.
    root /usr/share/nginx/html;
    index index.html;

    # --- 404 de verdade -----------------------------------------------------
    # $uri     → arquivo exato (/favicon.svg)
    # $uri/    → diretório com index.html (/planos/ → /planos/index.html)
    # =404     → não existe: devolve 404 em vez de cair na home
    location / {
        try_files $uri $uri/ =404;
    }

    # A página 404 do projeto, gerada pelo Astro em dist/404.html.
    # `internal` impede que alguém abra /404.html direto e receba 200 — URL de
    # erro não pode responder como página normal.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- cache --------------------------------------------------------------
    # Só /_astro/ leva cache eterno: tudo ali tem hash de conteúdo no nome
    # (CSS, JS e as imagens processadas pelo Astro). Muda o arquivo, muda a URL.
    #
    # O resto NÃO entra aqui de propósito. favicon.svg e og-image vêm de
    # public/ e mantêm o nome entre deploys — marcar como `immutable` prenderia
    # o favicon antigo no navegador do visitante por um ano.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML sempre revalida, senão o deploy novo não aparece.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # --- compressão ---------------------------------------------------------
    # A home tem 216 KB de HTML cru e ~33 KB com gzip. Seis vezes menos bytes
    # numa página que vende velocidade.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # WebP, woff2 e afins já vêm comprimidos: passar gzip por cima só gasta CPU.
}
