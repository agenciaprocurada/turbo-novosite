# Configuração do nginx para servir o dist/ deste projeto.
#
# Por que existe: o servidor de turbocloud-novo-site.up.turbo.cloud está com
# fallback de SPA (`try_files $uri $uri/ /index.html`). Isso faz QUALQUER
# endereço inexistente devolver 200 com a home — /asaaaaa, /nada.txt,
# /_astro/nao-existe.css, tudo. O 404 nunca acontece.
#
# Esse fallback é o certo para um app React de página única, onde só existe um
# HTML e o roteamento é no navegador. Aqui é o oposto: cada página é um arquivo
# de verdade no disco. O fallback só atrapalha.
#
# Se o painel do up.turbo.cloud tiver uma opção de "SPA" ou "rewrite tudo para
# index.html", desligar já resolve o 404 — o resto deste arquivo continua
# valendo pela compressão e pelo cache.

server {
    listen 80;
    root /var/www/html;   # ajustar para onde o dist/ é publicado
    index index.html;

    # --- 404 de verdade -----------------------------------------------------
    # $uri     → arquivo exato (/favicon.svg)
    # $uri/    → diretório com index.html (/planos/ → /planos/index.html)
    # =404     → não existe: devolve 404 em vez de cair na home
    location / {
        try_files $uri $uri/ =404;
    }

    # A página 404 do projeto, gerada pelo Astro em dist/404.html.
    # `internal` impede que alguém a acesse direto por /404.html e receba 200 —
    # a URL de erro não deve responder como página normal.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- compressão ---------------------------------------------------------
    # A home tem 216 KB de HTML sem compressão e ~33 KB com gzip. São 6× menos
    # bytes numa página que vende velocidade.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # --- cache --------------------------------------------------------------
    # Tudo em /_astro/ tem hash de conteúdo no nome: muda o arquivo, muda a URL.
    # Pode cachear para sempre sem risco de servir versão velha.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # As imagens processadas também levam hash no nome.
    location ~* \.(webp|avif|png|jpe?g|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML não: precisa revalidar para o deploy novo aparecer.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
