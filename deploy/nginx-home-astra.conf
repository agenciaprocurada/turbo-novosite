# Incluir dentro do bloco server do Nginx que serve esta aplicação.
# A plataforma precisa aplicar este trecho; o build do Astro não o instala.
# A página continua em src/pages/home-astra.astro. A reescrita é interna:
# o visitante recebe a página em /home-astra, sem redirect e sem porta 4321.
location = /home-astra {
    rewrite ^ /home-astra/index.html last;
}
