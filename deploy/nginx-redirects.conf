# Redirects 301 de verdade para as URLs do site antigo (WordPress).
# Incluir dentro do bloco server do Nginx que serve esta aplicação.
# A plataforma precisa aplicar este trecho; o build do Astro não o instala.
#
# Sem estas regras, as mesmas URLs funcionam pelo `redirects` do
# astro.config.mjs, mas como HTML com meta refresh e status 200 — o visitante
# chega, o Google demora mais para transferir a autoridade da URL antiga.
#
# A barra final é opcional (/whats e /whats/), como no site antigo.

# Antigo link do WhatsApp (anúncios, QR code e bio de rede social usam /whats).
# O atendimento saiu do WhatsApp em 27/10/2026: agora leva ao chat.
location ~ ^/whats/?$ { return 301 /contato/#falar-com-a-equipe; }

# Blog e campanhas antigas
location ~ ^/blog/?$ { return 301 /hospedagem/blogs-e-portais-de-conteudo/; }
location ~ ^/rd25/?$ { return 301 /; }

# Página clone do Cloud VPS
location ~ ^/hospedagem/opencloud-ps/?$ { return 301 /hospedagem/cloud-vps/; }

# Páginas que mudaram de endereço
location ~ ^/planos/?$ { return 301 /#planos; }
location ~ ^/calculadora-perda-de-trafego/?$ { return 301 /calculadora/; }
location ~ ^/politica-de-privacidade/?$ { return 301 /legal/#politica-de-privacidade; }

# Sitemaps do Yoast -> sitemap novo
location ~ ^/(sitemap_index|page-sitemap|ep_megamenu_content-sitemap)\.xml$ { return 301 /sitemap.xml; }

# Conteúdo interno do mega-menu do Elementor que o Yoast indexou
location ^~ /bdt-ep-megamenu-content/ { return 301 /hospedagem/; }
